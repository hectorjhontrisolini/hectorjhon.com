<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Lumina3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-4 font-sans">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Panel de Administración</h1>
            <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-red-600 transition">Cerrar Sesión</button>
        </div>

        <!-- Pestañas -->
        <div class="flex gap-4 mb-6 border-b border-gray-200">
            <button onclick="switchTab('orders')" id="tab-orders" class="px-4 py-2 text-indigo-600 border-b-2 border-indigo-600 font-bold">Pedidos</button>
            <button onclick="switchTab('products')" id="tab-products" class="px-4 py-2 text-gray-500 hover:text-indigo-600 font-bold transition">Productos</button>
        </div>

        <!-- SECCIÓN PEDIDOS -->
        <div id="section-orders" class="bg-white rounded-xl shadow overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Cliente</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Items</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Total</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Estado</th>
                    </tr>
                </thead>
                <tbody id="orders-table" class="bg-white divide-y divide-gray-200"></tbody>
            </table>
        </div>

        <!-- SECCIÓN PRODUCTOS (NUEVA) -->
        <div id="section-products" class="hidden space-y-6">
            <!-- Formulario para Añadir -->
            <div class="bg-white p-6 rounded-xl shadow border border-gray-100">
                <h2 class="text-lg font-bold mb-4 text-slate-800">Añadir Nuevo Producto</h2>
                <form id="product-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="p-nombre" placeholder="Nombre (Ej: Lámpara Luna)" required class="border p-2 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    <input type="number" step="0.01" id="p-precio" placeholder="Precio actual (Ej: 45.00)" required class="border p-2 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    <input type="number" step="0.01" id="p-oldPrice" placeholder="Precio anterior (Opcional)" class="border p-2 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    <input type="text" id="p-badge" placeholder="Etiqueta (Ej: Nuevo, -20%)" class="border p-2 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    <input type="url" id="p-img" placeholder="URL de la Imagen (Ej: https://...)" required class="border p-2 rounded-lg col-span-1 md:col-span-2 focus:ring-2 focus:ring-indigo-500">
                    <textarea id="p-desc" placeholder="Descripción corta" required class="border p-2 rounded-lg col-span-1 md:col-span-2 focus:ring-2 focus:ring-indigo-500"></textarea>
                    <button type="submit" class="bg-indigo-600 text-white py-2 rounded-lg font-bold col-span-1 md:col-span-2 hover:bg-indigo-700 transition shadow-md">Guardar Producto</button>
                </form>
            </div>

            <!-- Lista de Productos -->
            <div class="bg-white rounded-xl shadow overflow-x-auto border border-gray-100">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Imagen</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Nombre</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Precio</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="products-table" class="bg-white divide-y divide-gray-200"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="js/admin.js"></script>
</body>
</html>
