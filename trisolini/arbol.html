<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Árbol Genealógico · Archivo Familiar Trisolini</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">
<script>
  // Protección de acceso — se ejecuta antes de renderizar el contenido
  if (!sessionStorage.getItem('trisolini_access')) {
    window.location.href = 'index.html';
  }
</script>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  #arbol-contenedor {
    background: var(--color-fondo-arbol);
    min-height: calc(100vh - 56px);
    display: flex;
    flex-wrap: wrap;
  }
  #red-familiar {
    flex: 1 1 60%;
    min-width: 300px;
    height: 70vh;
  }
  #panel-info {
    flex: 1 1 320px;
    background: var(--color-marron-osc);
    color: var(--color-crema);
    padding: 1.5rem;
    border-left: 1px solid var(--color-borde);
  }
  #panel-info h2 { color: var(--color-dorado); font-size: 1.1rem; margin-top: 0; }
  #panel-info .rol { font-style: italic; color: var(--color-dorado); margin-bottom: 1rem; }
  #panel-info .campo { margin-bottom: 0.6rem; font-size: 0.9rem; }
  #panel-info .campo strong { color: var(--color-dorado); display: block; font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 1px; }
  #panel-info a.doc-link {
    display: inline-block;
    margin-top: 0.5rem;
    margin-right: 0.5rem;
    color: var(--color-crema);
    background: var(--color-verde-mil);
    padding: 0.4rem 0.9rem;
    border-radius: 3px;
    text-decoration: none;
    font-size: 0.8rem;
    font-family: 'Cinzel', serif;
  }
  #panel-info .placeholder { opacity: 0.6; font-style: italic; }
  .leyenda {
    padding: 0.75rem 1.5rem;
    background: var(--color-fondo-arbol);
    color: var(--color-crema);
    font-size: 0.8rem;
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
  }
  .leyenda span { display: flex; align-items: center; gap: 0.4rem; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>

<nav class="nav-trisolini">
  <a href="index.html">🌳 Familia Trisolini</a>
  <a href="biografia.html">📖 Biografía</a>
  <a href="arbol.html" class="activo">🌿 Árbol</a>
  <a href="batallon.html">⚓ Batallón</a>
  <a href="trayectoria.html">📅 Trayectoria</a>
  <a href="despacho.html">📜 Despacho</a>
  <button class="logout" onclick="cerrarSesion()">🔒 Salir</button>
</nav>

<div style="background: var(--color-fondo-arbol); padding: 1rem; display: flex; gap: 1rem; justify-content: center;">
  <button onclick="mostrarVista('red')" id="btnRed" style="background:#c9a227;color:#3d1f0a;border:none;padding:10px 20px;border-radius:4px;cursor:pointer;font-weight:bold;">🌳 Vista de Red</button>
  <button onclick="mostrarVista('zoom')" id="btnZoom" style="background:#8b6914;color:#fdf3e3;border:none;padding:10px 20px;border-radius:4px;cursor:pointer;font-weight:bold;">🔍 Imagen Zoom</button>
</div>

<div class="leyenda" id="leyendaRed">
  <span><span class="dot" style="background:#4a6741"></span> Generación 0 (bisabuelos)</span>
  <span><span class="dot" style="background:#7a2020"></span> Giuseppe Trisolini</span>
  <span><span class="dot" style="background:#c9a227"></span> Generación 1</span>
</div>

<div id="arbol-contenedor">
  <div id="red-familiar"></div>
  <div id="panel-info">
    <p class="placeholder">Selecciona un nodo del árbol para ver su información.</p>
  </div>
</div>

<!-- Vista de Zoom del Árbol Genealógico -->
<div id="zoom-contenedor" style="display:none;background:var(--color-fondo-arbol);min-height:calc(100vh - 180px);flex-direction:column;align-items:center;">
  <div style="background:#f5e6c8;padding:15px;text-align:center;margin:20px 0;border-radius:4px;max-width:1000px;font-size:14px;color:#3d1f0a;">
    📱 Scroll para ZOOM | Arrastra para DESPLAZARTE
  </div>
  <div id="zoomContenedor" style="flex:1;width:100%;max-width:90vw;max-height:70vh;overflow:auto;background:#2c1810;border:3px solid #c9a227;border-radius:4px;display:flex;align-items:center;justify-content:center;">
    <img id="zoomImg" src="assets/images/Arbol Genealogico Trisolini (completo) Ver04.webp" alt="Árbol Genealógico Zoom" style="width:100%;height:auto;cursor:grab;user-select:none;">
  </div>
</div>

<script src="app.js"></script>
<script src="familia.js"></script>
<script>
  // Construcción del árbol genealógico con vis-network
  const nodosVis = familiaData.nodes.map(n => {
    let color = '#c9a227'; // gen 1 por defecto
    if (n.id === 2) color = '#7a2020'; // Giuseppe
    else if (n.gen === 0) color = '#4a6741'; // bisabuelos

    return {
      id: n.id,
      label: n.label,
      shape: 'box',
      margin: 12,
      color: {
        background: color,
        border: n.id === 2 ? '#c9a227' : '#8b6914',
        highlight: { background: color, border: '#fdf3e3' }
      },
      borderWidth: n.id === 2 ? 3 : 1.5,
      font: { color: '#fdf3e3', face: 'Cinzel', size: 13, multi: false }
    };
  });

  const data = {
    nodes: new vis.DataSet(nodosVis),
    edges: new vis.DataSet(familiaData.edges.map(e => ({
      ...e,
      color: { color: '#8b6914' },
      font: { color: '#c9a227', size: 10, strokeWidth: 0, background: '#2c1810' }
    })))
  };

  const opciones = {
    layout: { hierarchical: { direction: 'UD', sortMethod: 'directed', levelSeparation: 150, nodeSpacing: 180 } },
    physics: false,
    interaction: { dragNodes: false, zoomView: true },
    edges: { arrows: { to: { enabled: false } }, smooth: { type: 'cubicBezier', roundness: 0.4 } }
  };

  const red = new vis.Network(document.getElementById('red-familiar'), data, opciones);

  const panel = document.getElementById('panel-info');

  red.on('click', function (params) {
    if (params.nodes.length === 0) return;
    const persona = familiaData.nodes.find(n => n.id === params.nodes[0]);
    if (!persona) return;

    let camposHtml = '';
    if (persona.nacimiento) camposHtml += `<div class="campo"><strong>Nacimiento</strong>${persona.nacimiento}</div>`;
    if (persona.profesion) camposHtml += `<div class="campo"><strong>Profesión</strong>${persona.profesion}</div>`;
    if (persona.grado) camposHtml += `<div class="campo"><strong>Grado</strong>${persona.grado}</div>`;
    if (persona.unidad) camposHtml += `<div class="campo"><strong>Unidad</strong>${persona.unidad}</div>`;

    let docsHtml = '';
    if (persona.docs && persona.docs.length) {
      docsHtml = persona.docs.map(d => `<a class="doc-link" href="${d}">Ver documento →</a>`).join('');
    }

    panel.innerHTML = `
      <h2>${persona.label.replace('\n', ' ')}</h2>
      <div class="rol">${persona.rol}</div>
      ${camposHtml}
      <div class="campo"><strong>Reseña</strong>${persona.info}</div>
      ${docsHtml}
    `;
  });

  // Cambiar entre vistas
  function mostrarVista(vista) {
    const red = document.getElementById('arbol-contenedor');
    const zoom = document.getElementById('zoom-contenedor');
    const btnRed = document.getElementById('btnRed');
    const btnZoom = document.getElementById('btnZoom');
    const leyenda = document.getElementById('leyendaRed');

    if (vista === 'red') {
      red.style.display = 'flex';
      zoom.style.display = 'none';
      leyenda.style.display = 'flex';
      btnRed.style.background = '#c9a227';
      btnRed.style.color = '#3d1f0a';
      btnZoom.style.background = '#8b6914';
      btnZoom.style.color = '#fdf3e3';
    } else {
      red.style.display = 'none';
      zoom.style.display = 'flex';
      leyenda.style.display = 'none';
      btnRed.style.background = '#8b6914';
      btnRed.style.color = '#fdf3e3';
      btnZoom.style.background = '#c9a227';
      btnZoom.style.color = '#3d1f0a';
      inicializarZoomArbol();
    }
  }

  // Zoom y Pan para imagen
  function inicializarZoomArbol() {
    let scale = 1;
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    const img = document.getElementById('zoomImg');
    const contenedor = document.getElementById('zoomContenedor');

    if (!img || !contenedor) return;

    contenedor.onwheel = function(e) {
      e.preventDefault();
      const paso = 0.3;
      scale += e.deltaY > 0 ? -paso : paso;
      scale = Math.max(1, Math.min(scale, 10));
      img.style.transform = `scale(${scale})`;
      img.style.transformOrigin = '0 0';
    };

    img.onmousedown = function(e) {
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      img.style.cursor = 'grabbing';
    };

    document.onmousemove = function(e) {
      if (isDragging && scale > 1) {
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        contenedor.scrollLeft -= dx;
        contenedor.scrollTop -= dy;
        startX = e.clientX;
        startY = e.clientY;
      }
    };

    document.onmouseup = function() {
      isDragging = false;
      if (img) img.style.cursor = 'grab';
    };
  }
</script>
</body>
</html>
