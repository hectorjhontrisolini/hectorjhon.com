version: "3.8"

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    HYDRO_PG_HOST: hydro-postgres
    HYDRO_PG_PORT: 5432
    HYDRO_PG_DB: hydro
    HYDRO_PG_USER: hydro
    HYDRO_PG_PASSWORD: hydro
    INFLUXDB_URL: http://influxdb:8086
    INFLUXDB_TOKEN: hydro-super-secret-token
    INFLUXDB_ORG: sat-hidrologico
    INFLUXDB_BUCKET: hidrologia
    _PIP_ADDITIONAL_REQUIREMENTS: "influxdb-client pandas"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./data:/opt/airflow/data
    - ./reports:/opt/airflow/reports
    - airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  airflow-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  hydro-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: hydro
      POSTGRES_PASSWORD: hydro
      POSTGRES_DB: hydro
    ports:
      - "5433:5432"
    volumes:
      - hydro-pg-data:/var/lib/postgresql/data
      - ./scripts/init_hydro_db.sql:/docker-entrypoint-initdb.d/init_hydro_db.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hydro"]
      interval: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin12345
      DOCKER_INFLUXDB_INIT_ORG: sat-hidrologico
      DOCKER_INFLUXDB_INIT_BUCKET: hidrologia
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: hydro-super-secret-token
    volumes:
      - influxdb-data:/var/lib/influxdb2

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname SAT \
          --role Admin --email admin@sat-hidrologico.local

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      - airflow-init

  api-status:
    build:
      context: .
      dockerfile: services/Dockerfile
    ports:
      - "8000:8000"
    environment:
      HYDRO_PG_HOST: hydro-postgres
      HYDRO_PG_PORT: 5432
      HYDRO_PG_DB: hydro
      HYDRO_PG_USER: hydro
      HYDRO_PG_PASSWORD: hydro
    depends_on:
      hydro-postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: influxdb
    volumes:
      - grafana-data:/var/lib/grafana
      - ./dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - influxdb
      - hydro-postgres

volumes:
  airflow-pg-data:
  hydro-pg-data:
  influxdb-data:
  grafana-data:
  airflow-logs:
