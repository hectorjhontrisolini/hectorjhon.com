  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

l.panelAlt }};overflow:hidden;\"><div style=\"height:100%;width:{{ commsBatt }}%;background:{{ commsBattColor }};\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- TELEMETRY COLUMN -->\n    <div style=\"display:grid;gridTemplateRows:1fr 1fr 1fr 0.85fr;gap:10px;minHeight:0;minWidth:0;overflow:hidden;\">\n\n      <div style=\"border:1px solid {{ pal.border }};borderRadius:6px;background:{{ pal.panel }};padding:10px 14px;display:flex;flexDirection:column;minHeight:0;\" onmousemove=\"{{ hoverNivel }}\" onmouseleave=\"{{ clearHover }}\">\n        <div style=\"display:flex;justifyContent:space-between;\">\n          <div style=\"fontFamily:{{ pal.fontHead }};fontSize:12px;fontWeight:700;letterSpacing:1.5px;color:{{ pal.accent }};\">NIVEL DEL RÍO<\u002Fdiv>\n          <div style=\"fontFamily:{{ pal.fontMono }};fontSize:15px;fontWeight:700;color:{{ nivelColor }};\">{{ nivelNow }} m<\u002Fdiv>\n        <\u002Fdiv>\n        <svg viewBox=\"0 0 360 100\" style=\"width:100%;flex:1;\" preserveAspectRatio=\"none\">\n          <line x1=\"0\" y1=\"60\" x2=\"360\" y2=\"60\" stroke=\"{{ pal.border }}\" stroke-dasharray=\"3,4\"><\u002Fline>\n          <polyline points=\"{{ nivelPoints }}\" fill=\"none\" stroke=\"{{ pal.accent }}\" stroke-width=\"2.2\"><\u002Fpolyline>\n          <sc-if value=\"{{ nivelHover }}\" hint-placeholder-val=\"{{ false }}\">\n            <line x1=\"{{ nivelHover.x }}\" y1=\"0\" x2=\"{{ nivelHover.x }}\" y2=\"100\" stroke=\"{{ pal.dim }}\" stroke-width=\"1\"><\u002Fline>\n            <circle cx=\"{{ nivelHover.x }}\" cy=\"{{ nivelHover.y }}\" r=\"3.5\" fill=\"{{ pal.accent2 }}\"><\u002Fcircle>\n          <\u002Fsc-if>\n        <\u002Fsvg>\n        <sc-if value=\"{{ nivelHover }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"fontSize:10px;color:{{ pal.dim }};\">valor: {{ nivelHover.val }} m<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid {{ pal.border }};borderRadius:6px;background:{{ pal.panel }};padding:10px 14px;display:flex;flexDirection:column;minHeight:0;\">\n        <div style=\"display:flex;justifyContent:space-between;\">\n          <div style=\"fontFamily:{{ pal.fontHead }};fontSize:12px;fontWeight:700;letterSpacing:1.5px;color:{{ pal.accent }};\">CAUDAL ESTIMADO<\u002Fdiv>\n          <div style=\"fontFamily:{{ pal.fontMono }};fontSize:15px;fontWeight:700;color:{{ pal.text }};\">{{ caudalNow }} m³/s<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;display:flex;alignItems:flex-end;gap:3px;\">\n          <sc-for list=\"{{ caudalBars }}\" as=\"b\" hint-placeholder-count=\"18\">\n            <div style=\"flex:1;height:{{ b.h }}%;background:{{ pal.accent2 }};opacity:{{ b.op }};borderRadius:2px 2px 0 0;\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid {{ pal.border }};borderRadius:6px;background:{{ pal.panel }};padding:10px 14px;display:flex;flexDirection:column;minHeight:0;\">\n        <div style=\"display:flex;justifyContent:space-between;\">\n          <div style=\"fontFamily:{{ pal.fontHead }};fontSize:12px;fontWeight:700;letterSpacing:1.5px;color:{{ pal.accent }};\">PRECIPITACIÓN<\u002Fdiv>\n          <div style=\"fontFamily:{{ pal.fontMono }};fontSize:15px;fontWeight:700;color:{{ pal.text }};\">{{ precipNow }} mm/h<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;display:flex;alignItems:flex-end;gap:3px;\">\n          <sc-for list=\"{{ precipBars }}\" as=\"b\" hint-placeholder-count=\"18\">\n            <div style=\"flex:1;height:{{ b.h }}%;background:{{ b.color }};opacity:0.85;borderRadius:2px 2px 0 0;\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid {{ pal.border }};borderRadius:6px;background:{{ pal.panel }};padding:10px 14px;display:flex;flexDirection:column;justifyContent:center;gap:6px;minHeight:0;\">\n        <div style=\"display:flex;justifyContent:space-between;alignItems:center;\">\n          <div style=\"fontFamily:{{ pal.fontHead }};fontSize:12px;fontWeight:700;letterSpacing:1.5px;color:{{ pal.accent }};\">PREDICCIÓN (MODELO ML)<\u002Fdiv>\n          <div style=\"fontFamily:{{ pal.fontMono }};fontSize:12px;fontWeight:700;color:{{ riskColor }};\">{{ riskLabel }} · {{ riskProbability }}%<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:8px;borderRadius:4px;background:{{ pal.panelAlt }};overflow:hidden;\">\n          <div style=\"height:100%;width:{{ riskProbability }}%;background:{{ riskColor }};boxShadow:0 0 8px {{ riskColor }};transition:width 0.6s ease;\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ replaying }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;top:16px;left:50%;transform:translateX(-50%);background:{{ pal.panel }};border:1px solid {{ pal.accent }};borderRadius:20px;padding:6px 18px;fontSize:11px;letterSpacing:2px;color:{{ pal.accent }};boxShadow:{{ pal.glow }};zIndex:20;\">▸▸ REPRODUCIENDO ÚLTIMAS 24H — {{ replayProgress }}%<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst STATION_POOL = [\n  { id:'TUMBES_01', name:'TUMBES 01', cuenca:'TUMBES', departamento:'Tumbes', totalStations:9, x:70, y:38 },\n  { id:'PIURA_02', name:'PIURA 02', cuenca:'CHIRA-PIURA', departamento:'Piura', totalStations:16, x:64, y:68 },\n  { id:'CHIRA_03', name:'CHIRA 03', cuenca:'CHIRA-PIURA', departamento:'Piura', totalStations:16, x:58, y:88 },\n  { id:'LAMBAYEQUE_04', name:'LAMBAYEQUE 04', cuenca:'LAMBAYEQUE', departamento:'Lambayeque', totalStations:11, x:56, y:118 },\n  { id:'SANTA_05', name:'SANTA 05', cuenca:'SANTA', departamento:'Áncash', totalStations:13, x:48, y:168 },\n  { id:'CHILLON_06', name:'CHILLON 06', cuenca:'CHILLÓN', departamento:'Lima', totalStations:8, x:52, y:214 },\n  { id:'RIMAC_001', name:'RIMAC 001', cuenca:'RÍMAC', dep 9,3.2,3.4,3.3,3.0,2.6],\n    caudalSeries: [3.7,4.0,4.4,5.1,6.4,8.1,9.8,10.8,11.5,11.2,10.1,8.8],\n    precipSeries: [2,4,8,14,22,29,31,28,20,12,6,3],\n  },\n  RIMAC_2025: {\n    label: 'Cuencas Rímac y Chillón, Lima — Temporada 2025-2026',\n    anomalies: [\n      { id:'RIMAC_001', name:'RIMAC 001', cuenca:'RÍMAC', departamento:'Lima', x:56, y:230, nivel:2.1, precip:14.5, rssi:-70, bateria:81 },\n      { id:'CHILLON_06', name:'CHILLON 06', cuenca:'CHILLÓN', departamento:'Lima', x:52, y:214, nivel:1.9, precip:11.2, rssi:-66, bateria:74 },\n    ],\n    alerts: [\n      { id:'hist_rimac_1', stationId:'RIMAC_001', station:'RIMAC 001', cuenca:'RÍMAC', severity:'MEDIA', message:'Nivel elevado sostenido durante temporada de lluvias', tcode:'09:12:00', fresh:false },\n    ],\n    nivelSeries: [1.0,1.2,1.4,1.6,1.8,1.9,2.0,2.1,2.0,1.9,1.8,1.7],\n    caudalSeries: [3.2,3.6,4.0,4.5,5.0,5.4,5.7,5.9,5.6,5.3,5.0,4.7],\n    precipSeries: [3,5,7,9,11,13,14,13,10,8,6,4],\n  },\n  PIURA_2023: {\n    label: 'Cuenca Chira-Piura — Marzo 2023',\n    anomalies: [\n      { id:'PIURA_02', name:'PIURA 02', cuenca:'CHIRA-PIURA', departamento:'Piura', x:64, y:68, nivel:2.8, precip:26.0, rssi:-95, bateria:38 },\n      { id:'CHIRA_03', name:'CHIRA 03', cuenca:'CHIRA-PIURA', departamento:'Piura', x:58, y:88, nivel:2.5, precip:22.4, rssi:-88, bateria:44 },\n    ],\n    alerts: [\n      { id:'hist_piura_1', stationId:'PIURA_02', station:'PIURA 02', cuenca:'CHIRA-PIURA', severity:'CRÍTICA', message:'Desborde por lluvias El Niño Costero', tcode:'03:20:00', fresh:false },\n    ],\n    nivelSeries: [1.4,1.7,2.0,2.3,2.6,2.8,2.9,2.8,2.6,2.3,2.0,1.8],\n    caudalSeries: [4.8,5.6,6.5,7.4,8.3,8.9,9.2,8.9,8.3,7.4,6.5,5.8],\n    precipSeries: [6,10,15,20,24,26,25,21,16,11,7,4],\n  },\n};\n\nconst PALETTES = {\n  spacex: {\n    bg:'#05070a', gridLine:'rgba(0,212,255,0.045)', panel:'#0b1017', panelAlt:'#0e161f',\n    border:'rgba(0,212,255,0.28)', accent:'#00d4ff', accent2:'#7cf7ff', text:'#e8f6ff', dim:'#7d93a3',\n    success:'#2ee6a6', warning:'#ffcc33', critical:'#ff3b4e',\n    fontHead:\"'Orbitron', sans-serif\", fontMono:\"'Roboto Mono', monospace\",\n    glow:'0 0 14px rgba(0,212,255,0.35)'\n  },\n  nasa: {\n    bg:'#0a0a0c', gridLine:'rgba(255,176,0,0.04)', panel:'#111214', panelAlt:'#17181a',\n    border:'rgba(255,176,0,0.28)', accent:'#ffb000', accent2:'#4fa8ff', text:'#f3ede2', dim:'#8a8578',\n    success:'#33d17a', warning:'#ffb000', critical:'#ff4d3d',\n    fontHead:\"'Exo 2', sans-serif\", fontMono:\"'Roboto Mono', monospace\",\n    glow:'0 0 14px rgba(255,176,0,0.3)'\n  }\n};\n\nfunction rnd(min, max) { return Math.random() * (max - min) + min; }\nfunction clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }\nfunction pad2(n) { return n.toString().padStart(2, '0'); }\n\nclass Component extends DCLogic {\n  state = {\n    theme: 'spacex',\n    now: new Date(),\n    anomalies: [],\n    alerts: [],\n    hoverId: null,\n    selectedId: null,\n    nivelHoverIdx: null,\n    nivelSeries: [],\n    caudalSeries: [],\n    precipSeries: [],\n    replaying: false,\n    replayProgress: 0,\n    selectedDepartamento: 'TODOS',\n    selectedCuenca: 'TODAS',\n    severityFilter: 'TODAS',\n    historicalMode: 'LIVE',\n  };\n\n  componentDidMount() {\n    const n = 12;\n    const nivelSeries = [];\n    const caudalSeries = [];\n    const precipSeries = [];\n    let base = 1.1;\n    for (let i = 0; i < n; i++) {\n      base = clamp(base + rnd(-0.08, 0.1), 0.6, 2.0);\n      nivelSeries.push(base);\n      caudalSeries.push(base * 3.4 + rnd(-0.5, 0.5));\n      precipSeries.push(Math.max(0, rnd(-2, 6)));\n    }\n    const anomalies = this.pickAnomalies(5);\n    const alerts = anomalies.slice(0, 3).map((s, i) => this.makeAlert(s, i === 0 ? 'CRÍTICA' : 'MEDIA'));\n    this.setState({ nivelSeries, caudalSeries, precipSeries, anomalies, alerts });\n\n    this._clockTimer = setInterval(() => this.setState({ now: new Date() }), 1000);\n    this._tickTimer = setInterval(() => this.tick(), 3000);\n  }\n\n  componentWillUnmount() {\n    clearInterval(this._clockTimer);\n    clearInterval(this._tickTimer);\n    clearTimeout(this._flashTimer);\n    clearInterval(this._replayTimer);\n  }\n\n  pickAnomalies(count) {\n    const shuffled = [...STATION_POOL].sort(() => Math.random() - 0.5).slice(0, count);\n    return shuffled.map(s => ({\n      ...s,\n      nivel: +rnd(1.4, 3.4).toFixed(2),\n      precip: +rnd(5, 28).toFixed(1),\n      rssi: Math.round(rnd(-105, -55)),\n      bateria: Math.round(rnd(15, 95)),\n    }));\n  }\n\n  severityFor(st) {\n    if (st.nivel > 2.5) return 'CRÍTICA';\n    if (st.nivel > 1.8 || st.precip > 15) return 'MEDIA';\n    return 'BAJA';\n  }\n\n  makeAlert(st, severityOverride) {\n    const severity = severityOverride || this.severityFor(st);\n    const now = new Date();\n    const msgs = {\n      'CRÍTICA': `Nivel crítico detectado: ${st.nivel} m — riesgo de crecida`,\n      'MEDIA': `Lluvia intensa / nivel elevado: ${st.precip} mm·h, ${st.nivel} m`,\n      'BAJA': `Variación registrada en estación`,\n    };\n    return {\n      id: st.id + '_' + now.getTime(),\n      stationId: st.id,\n      station: st.name,\n      cuenca: st.cuenca,\n      severity,\n      message: msgs[severity],\n      tcode: `${pad2(now.getUTCHours())}:${pad2(now.getUTCMinutes())}:${pad2(now.getUTCSeconds())}`,\n      fresh: true,\n    };\n  }\n\n  tick() {\n    if (this.state.historicalMode !== 'LIVE') return;\n    this.setState(s => {\n      let anomalies = s.anomalies.map(st => ({\n        ...st,\n        nivel: +clamp(st.nivel + rnd(-0.15, 0.18), 0.3, 4.5).toFixed(2),\n        precip: +clamp(st.precip + rnd(-3, 4), 0, 40).toFixed(1),\n        rssi: Math.round(clamp(st.rssi + rnd(-4, 4), -115, -45)),\n        bateria: Math.round(clamp(st.bateria - rnd(0, 0.4), 5, 100)),\n      }));\n      if (Math.random() < 0.35 && anomalies.length < 8) {\n        const pool = STATION_POOL.filter(p => !anomalies.some(a => a.id === p.id));\n        if (pool.length) anomalies = [...anomalies, ...this.pickAnomalies(1).filter(a => pool.some(p => p.id === a.id))];\n      }\n      if (Math.random() < 0.25 && anomalies.length > 3) {\n        anomalies = anomalies.slice(1);\n      }\n\n      let last = s.nivelSeries[s.nivelSeries.length - 1] || 1.2;\n      const nextNivel = clamp(last + rnd(-0.1, 0.12), 0.5, 3.6);\n      const nivelSeries = [...s.nivelSeries.slice(1), nextNivel];\n      const caudalSeries = [...s.caudalSeries.slice(1), nextNivel * 3.4 + rnd(-0.4, 0.4)];\n      const precipSeries = [...s.precipSeries.slice(1), Math.max(0, rnd(-2, 7))];\n\n      let alerts = s.alerts.map(a => ({ ...a, fresh: false }));\n      const critical = anomalies.find(a => a.nivel > 2.6);\n      if (critical && Math.random() < 0.5 && !alerts.some(a => a.stationId === critical.id && a.severity === 'CRÍTICA')) {\n        alerts = [this.makeAlert(critical, 'CRÍTICA'), ...alerts].slice(0, 8);\n      }\n\n      return { anomalies, nivelSeries, caudalSeries, precipSeries, alerts };\n    });\n  }\n\n  toggleTheme = () => this.setState(s => ({ theme: s.theme === 'spacex' ? 'nasa' : 'spacex' }));\n\n  setDepartamento = (dep) => {\n    this.setState({ selectedDepartamento: dep, selectedCuenca: 'TODAS' });\n  };\n\n  setCuenca = (cuenca) => this.setState({ selectedCuenca: cuenca });\n\n  setSeverityFilter = (v) => this.setState({ severityFilter: v });\n\n  setHistorical = (key) => {\n    if (key === 'LIVE') {\n      const anomalies = this.pickAnomalies(5);\n      const alerts = anomalies.slice(0, 3).map((s, i) => this.makeAlert(s, i === 0 ? 'CRÍTICA' : 'MEDIA'));\n      this.setState({ historicalMode: 'LIVE', anomalies, alerts });\n      clearInterval(this._tickTimer);\n      this._tickTimer = setInterval(() => this.tick(), 3000);\n      return;\n    }\n    const scenario = HISTORICAL_SCENARIOS[key];\n    if (!scenario) return;\n    clearInterval(this._tickTimer);\n    this.setState({\n      historicalMode: key,\n      anomalies: scenario.anomalies,\n      alerts: scenario.alerts,\n      nivelSeries: scenario.nivelSeries,\n      caudalSeries: scenario.caudalSeries,\n      precipSeries: scenario.precipSeries,\n    });\n  };\n\n  selectStation = (id) => this.setState({ selectedId: id, hoverId: id });\n  hoverStation = (id) => this.setState({ hoverId: id });\n  unhoverStation = () => this.setState({ hoverId: null });\n\n  hoverNivel = (evt) => {\n    const rect = evt.currentTarget.getBoundingClientRect();\n    const frac = clamp((evt.clientX - rect.left) / rect.width, 0, 1);\n    const idx = Math.round(frac * (this.state.nivelSeries.length - 1));\n    this.setState({ nivelHoverIdx: idx });\n  };\n  clearHover = () => this.setState({ nivelHoverIdx: null });\n\n  simulateCriticalEvent = () => {\n    this.setState(s => {\n      const pool = STATION_POOL.filter(p => !s.anomalies.some(a => a.id === p.id));\n      const base = pool.length ? pool[Math.floor(Math.random() * pool.length)] : STATION_POOL[Math.floor(Math.random() * STATION_POOL.length)];\n      const critStation = { ...base, nivel: +rnd(2.7, 3.6).toFixed(2), precip: +rnd(20, 35).toFixed(1), rssi: Math.round(rnd(-90, -60)), bateria: Math.round(rnd(30, 90)) };\n      const anomalies = [critStation, ...s.anomalies.filter(a => a.id !== critStation.id)].slice(0, 8);\n      const alert = this.makeAlert(critStation, 'CRÍTICA');\n      const alerts = [alert, ...s.alerts.map(a => ({ ...a, fresh: false }))].slice(0, 8);\n      return { anomalies, alerts };\n    });\n    clearTimeout(this._flashTimer);\n    this._flashTimer = setTimeout(() => {\n      this.setState(s => ({ alerts: s.alerts.map(a => ({ ...a, fresh: false })) }));\n    }, 1400);\n  };\n\n  replayLast24h = () => {\n    if (this.state.replaying) return;\n    this.setState({ replaying: true, replayProgress: 0 });\n    clearInterval(this._replayTimer);\n    this._replayTimer = setInterval(() => {\n      this.setState(s => {\n        const next = s.replayProgress + 4;\n        if (next >= 100) {\n          clearInterval(this._replayTimer);\n          return { replaying: false, replayProgress: 0 };\n        }\n        return { replayProgress: next };\n      });\n    }, 120);\n  };\n\n  renderVals() {\n    const s = this.state;\n    const pal = PALETTES[s.theme];\n    const themeLabel = s.theme === 'spacex' ? 'SPACEX' : 'NASA';\n\n    const clockStr = `${pad2(s.now.getUTCHours())}:${pad2(s.now.getUTCMinutes())}:${pad2(s.now.getUTCSeconds())}`;\n    const dateStr = s.now.toLocaleDateString('es-PE', { day:'2-digit', month:'long', year:'numeric', timeZone:'UTC' }).toUpperCase();\n\n    const criticalCount = s.alerts.filter(a => a.severity === 'CRÍTICA').length;\n    const mediumCount = s.alerts.filter(a => a.severity === 'MEDIA').length;\n    const statusColor = criticalCount > 0 ? pal.critical : (mediumCount > 0 ? pal.warning : pal.success);\n    const statusLabel = criticalCount > 0 ? 'ESTADO: CRÍTICO' : (mediumCount > 0 ? 'ESTADO: ALERTA' : 'ESTADO: NOMINAL');\n\n    const latencia = Math.round(rnd(120, 260));\n    const counters = [\n      { label:'Estaciones Activas', value: 200, color: pal.accent },\n      { label:'Alertas Activas', value: s.alerts.length, color: pal.warning },\n      { label:'Eventos Críticos', value: criticalCount, color: pal.critical },\n      { label:'Latencia Prom.', value: latencia + ' ms', color: pal.success },\n    ];\n\n    const W = 320, H = 520;\n\n    const severityOf = (st) => st.nivel > 2.5 ? 'CRÍTICA' : (st.nivel > 1.8 || st.precip > 15 ? 'MEDIA' : 'BAJA');\n    const passesFilters = (st) => {\n      if (s.selectedCuenca !== 'TODAS' && st.cuenca !== s.selectedCuenca) return false;\n      if (s.selectedDepartamento !== 'TODOS' && st.departamento !== s.selectedDepartamento) return false;\n      if (s.severityFilter !== 'TODAS' && severityOf(st) !== s.severityFilter) return false;\n      return true;\n    };\n\n    const stationsAll = s.anomalies.map(st => {\n      const color = severityOf(st) === 'CRÍTICA' ? pal.critical : (severityOf(st) === 'MEDIA' ? pal.warning : pal.success);\n      return {\n        ...st, color,\n        onClick: () => this.selectStation(st.id),\n        onEnter: () => this.hoverStation(st.id),\n        onLeave: () => this.unhoverStation(),\n      };\n    });\n    const stations = stationsAll.filter(passesFilters);\n\n    const departamentoOptions = DEPARTAMENTOS;\n    const cuencasDisponibles = s.selectedDepartamento === 'TODOS'\n      ? [...new Set(STATION_POOL.map(p => p.cuenca))]\n      : [...new Set(STATION_POOL.filter(p => p.departamento === s.selectedDepartamento).map(p => p.cuenca))];\n    const cuencaOptions = cuencasDisponibles;\n\n    const cuencaCards = cuencasDisponibles.map(cuencaName => {\n      const rep = STATION_POOL.find(p => p.cuenca === cuencaName);\n      const activeAnomaly = stationsAll.find(a => a.cuenca === cuencaName);\n      const risk = activeAnomaly ? severityOf(activeAnomaly) : 'BAJA';\n      const color = risk === 'CRÍTICA' ? pal.critical : (risk === 'MEDIA' ? pal.warning : pal.success);\n      return {\n        name: cuencaName,\n        departamento: rep ? rep.departamento : '',\n        total: rep ? rep.totalStations : 0,\n        risk, color,\n        selected: s.selectedCuenca === cuencaName,\n        verCuenca: () => this.setCuenca(cuencaName),\n      };\n    });\n\n    const hoverSt = s.hoverId ? s.anomalies.find(a => a.id === s.hoverId) : null;\n    const hoverStation = hoverSt ? {\n      ...hoverSt,\n      color: hoverSt.nivel > 2.5 ? pal.critical : (hoverSt.nivel > 1.8 || hoverSt.precip > 15 ? pal.warning : pal.success),\n      leftPct: (hoverSt.x / W) * 100,\n      topPct: (hoverSt.y / H) * 100,\n    } : false;\n\n    const alerts = s.alerts.map(a => ({\n      ...a,\n      color: a.severity === 'CRÍTICA' ? pal.critical : (a.severity === 'MEDIA' ? pal.warning : pal.success),\n      shake: a.fresh ? 'shakeRow 0.4s ease 2' : 'none',\n      verEstacion: () => this.selectStation(a.stationId),\n    }));\n\n    const nivelSeries = s.nivelSeries;\n    const nMax = 4, nMin = 0;\n    const nivelPoints = nivelSeries.map((v, i) => {\n      const x = (i / (nivelSeries.length - 1)) * 360;\n      const y = 100 - ((v - nMin) / (nMax - nMin)) * 90 - 5;\n      return `${x.toFixed(1)},${y.toFixed(1)}`;\n    }).join(' ');\n    const nivelNow = nivelSeries[nivelSeries.length - 1]?.toFixed(2) ?? '0.00';\n    const nivelColor = nivelNow > 2.5 ? pal.critical : (nivelNow > 1.8 ? pal.warning : pal.accent);\n\n    let nivelHover = null;\n    if (s.nivelHoverIdx !== null && nivelSeries[s.nivelHoverIdx] !== undefined) {\n      const v = nivelSeries[s.nivelHoverIdx];\n      const x = (s.nivelHoverIdx / (nivelSeries.length - 1)) * 360;\n      const y = 100 - ((v - nMin) / (nMax - nMin)) * 90 - 5;\n      nivelHover = { x: x.toFixed(1), y: y.toFixed(1), val: v.toFixed(2) };\n    }\n\n    const caudalMax = Math.max(...s.caudalSeries, 1);\n    const caudalBars = s.caudalSeries.map((v, i) => ({ h: clamp((v / caudalMax) * 100, 4, 100), op: 0.5 + (i / s.caudalSeries.length) * 0.5 }));\n    const caudalNow = s.caudalSeries[s.caudalSeries.length - 1]?.toFixed(1) ?? '0.0';\n\n    const precipMax = Math.max(...s.precipSeries, 1, 10);\n    const precipBars = s.precipSeries.map(v => ({ h: clamp((v / precipMax) * 100, 3, 100), color: v > 15 ? pal.warning : pal.accent2 }));\n    const precipNow = s.precipSeries[s.precipSeries.length - 1]?.toFixed(1) ?? '0.0';\n\n    const riskProbability = clamp(Math.round(((parseFloat(nivelNow) - 0.5) / 3) * 100), 3, 97);\n    const riskColor = riskProbability > 65 ? pal.critical : (riskProbability > 35 ? pal.warning : pal.success);\n    const riskLabel = riskProbability > 65 ? 'RIESGO ALTO' : (riskProbability > 35 ? 'RIESGO MEDIO' : 'RIESGO BAJO');\n\n    const featured = (s.selectedId && s.anomalies.find(a => a.id === s.selectedId)) || s.anomalies[0];\n    const commsStationLabel = featured ? featured.name : '—';\n    const commsRssi = featured ? featured.rssi : -80;\n    const commsRssiPct = clamp(((commsRssi + 120) / 70) * 100, 0, 100);\n    const commsRssiColor = commsRssi < -100 ? pal.critical : (commsRssi < -85 ? pal.warning : pal.success);\n    const commsBatt = featured ? featured.bateria : 80;\n    const commsBattColor = commsBatt < 20 ? pal.critical : (commsBatt < 40 ? pal.warning : pal.success);\n\n    const historicalOptions = [\n      { value:'LIVE', label:'En vivo (ahora)' },\n      { value:'ICA_2024', label:HISTORICAL_SCENARIOS.ICA_2024.label },\n      { value:'RIMAC_2025', label:HISTORICAL_SCENARIOS.RIMAC_2025.label },\n      { value:'PIURA_2023', label:HISTORICAL_SCENARIOS.PIURA_2023.label },\n    ];\n    const isHistorical = s.historicalMode !== 'LIVE';\n    const historicalLabel = isHistorical ? (HISTORICAL_SCENARIOS[s.historicalMode]?.label ?? '') : '';\n\n    const cuencaStations = stations.map(st => ({\n      ...st,\n      severity: severityOf(st),\n      verEstacion: () => this.selectStation(st.id),\n    }));\n\n    return {\n      pal, themeLabel, toggleTheme: this.toggleTheme,\n      clockStr, dateStr, statusColor, statusLabel, counters,\n      stations, hoverStation,\n      alerts,\n      nivelPoints, nivelNow, nivelColor, nivelHover, hoverNivel: this.hoverNivel, clearHover: this.clearHover,\n      caudalBars, caudalNow,\n      precipBars, precipNow,\n      riskProbability, riskColor, riskLabel,\n      commsStationLabel, commsRssi, commsRssiPct, commsRssiColor, commsBatt, commsBattColor,\n      simulateCriticalEvent: this.simulateCriticalEvent,\n      replayLast24h: this.replayLast24h, replayLabel: s.replaying ? 'REPRODUCIENDO…' : '▸ REPRODUCIR 24H',\n      replaying: s.replaying, replayProgress: s.replayProgress,\n      departamentoOptions, cuencaOptions, cuencaCards,\n      selectedDepartamento: s.selectedDepartamento, selectedCuenca: s.selectedCuenca, severityFilter: s.severityFilter,\n      onDepartamentoChange: (e) => this.setDepartamento(e.target.value),\n      onCuencaChange: (e) => this.setCuenca(e.target.value),\n      onSeverityChange: (e) => this.setSeverityFilter(e.target.value),\n      onHistoricalChange: (e) => this.setHistorical(e.target.value),\n      severityOptions: ['TODAS', 'BAJA', 'MEDIA', 'CRÍTICA'],\n      historicalOptions, isHistorical, historicalLabel, historicalMode: s.historicalMode,\n      cuencaStations,\n      cuencaLabelForCol3: s.selectedCuenca === 'TODAS' ? 'TODAS LAS CUENCAS' : s.selectedCuenca,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
